<g class="rise" style="animation-delay:0.3s"><line x1="72" y1="152" x2="104" y2="152" stroke="#5FD6A4" stroke-opacity=".6"/><text x="116" y="157" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8FB3A2" letter-spacing="3"  font-style="normal" text-anchor="start" opacity="1">DATA SCIENCE · MACHINE LEARNING · APPLIED AI</text></g>
<g class="rise" style="animation-delay:0.5s"><text x="72" y="252" font-family="Georgia,'Times New Roman',serif" font-size="76" fill="#E8F5EE" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">Muhammad</text></g>
