<g><animateTransform attributeName="transform" type="rotate" from="360 980 250" to="0 980 250" dur="60s" repeatCount="indefinite"/><circle cx="980" cy="250" r="100" fill="none" stroke="#E6C068" stroke-opacity=".3" stroke-dasharray="2 10"/></g>
