<circle r="5" fill="#E8F5EE" opacity="0"><animateMotion dur="5s" begin="3.8s" repeatCount="indefinite" path="M760,400 L830,350 L890,372 L960,290 L1030,310 L1100,200 L1150,150" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="5s" begin="3.8s" repeatCount="indefinite"/></circle>
