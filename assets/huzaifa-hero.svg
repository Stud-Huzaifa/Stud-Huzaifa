<g class="rise" style="animation-delay:1.0s"><text x="74" y="384" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#8FB3A2" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">Turning data questions into practical projects — from</text><text x="74" y="412" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#8FB3A2" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">exploration and evaluation to usable apps and APIs.</text></g>
<g class="rise" style="animation-delay:1.2s"><text x="74" y="448" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#4F7566" letter-spacing="1"  font-style="normal" text-anchor="start" opacity="1">Karachi, Pakistan  ·  BS Data Science, DUET</text></g></svg>