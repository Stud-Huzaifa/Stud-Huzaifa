<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
<radialGradient id="g" cx="0.5" cy="1.0" r="0.8"><stop offset="0" stop-color="#0F6B4E" stop-opacity=".75"/><stop offset="1" stop-color="#0F6B4E" stop-opacity="0"/></radialGradient>
<radialGradient id="blob"><stop offset="0" stop-color="#0F6B4E" stop-opacity=".5"/><stop offset="1" stop-color="#0F6B4E" stop-opacity="0"/></radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1C15"/><stop offset="1" stop-color="#050F0B"/></linearGradient>
<linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#5FD6A4" stop-opacity="0"/><stop offset=".5" stop-color="#5FD6A4"/><stop offset="1" stop-color="#5FD6A4" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5FD6A4" stroke-opacity=".05"/></pattern>
</defs>
<style>
.rise{animation:rise 1.1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade{animation:fade 1.4s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
.br{animation:br 6s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.65}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
<rect width="1200" height="250" rx="22" fill="url(#bg)"/><rect class="br" width="1200" height="250" rx="22" fill="url(#g)"/><rect width="1200" height="250" rx="22" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="249" rx="22" fill="none" stroke="#1E4A39" stroke-opacity=".6"/>
<circle class="tw" style="animation-delay:0.0s" cx="300" cy="50" r="1.6" fill="#E8F5EE"/><circle class="tw" style="animation-delay:0.6s" cx="520" cy="34" r="1.6" fill="#E8F5EE"/><circle class="tw" style="animation-delay:1.2s" cx="700" cy="60" r="1.6" fill="#E8F5EE"/><circle class="tw" style="animation-delay:1.8s" cx="900" cy="44" r="1.6" fill="#E8F5EE"/><circle class="tw" style="animation-delay:2.4s" cx="420" cy="90" r="1.6" fill="#E8F5EE"/><circle class="tw" style="animation-delay:3.0s" cx="820" cy="98" r="1.6" fill="#E8F5EE"/><circle class="tw" style="animation-delay:3.6s" cx="1000" cy="70" r="1.6" fill="#E8F5EE"/><circle class="tw" style="animation-delay:4.2s" cx="150" cy="120" r="1.6" fill="#E8F5EE"/><circle class="tw" style="animation-delay:4.8s" cx="1100" cy="150" r="1.6" fill="#E8F5EE"/><g class="rise" style="animation-delay:0.2s"><text x="600" y="118" font-family="Georgia,'Times New Roman',serif" font-size="48" fill="#E8F5EE" letter-spacing="0"  font-style="normal" text-anchor="middle" opacity="1">Learn by building.</text></g><g class="rise" style="animation-delay:0.6s"><text x="600" y="172" font-family="Georgia,'Times New Roman',serif" font-size="48" fill="#5FD6A4" letter-spacing="0"  font-style="italic" text-anchor="middle" opacity="1">Improve by shipping.</text></g><g class="fade" style="animation-delay:1.0s"><text x="600" y="212" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#8FB3A2" letter-spacing="4"  font-style="normal" text-anchor="middle" opacity="1">MUHAMMAD HUZAIFA  ·  DATA SCIENCE  ·  KARACHI</text></g><rect x="300" y="236" width="160" height="2" rx="1" fill="#5FD6A4" opacity="0"><animate attributeName="x" values="300;740" dur="6s" begin="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.15;.85;1" dur="6s" begin="2s" repeatCount="indefinite"/></rect></svg>