 New Roman',serif" font-size="22" fill="#8FB3A2" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">Model evaluation</text></g><g class="rise" style="animation-delay:0.54s"><rect x="612" y="40" width="276" height="230" rx="16" fill="#0C1F18" fill-opacity="0.9" stroke="#1E4A39"/><line x1="636" y1="41" x2="864" y2="41" stroke="url(#line)"/><text x="634" y="76" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#5FD6A4" letter-spacing="3"  font-style="normal" text-anchor="start" opacity="1">03 APPS &amp; APIS</text><text x="634" y="126" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#E8F5EE" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">Streamlit</text><text x="634" y="166" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#E8F5EE" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">Flask · FastAPI</text><text x="634" y="206" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#8FB3A2" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">React</text></g><g class="rise" style="animation-delay:0.76s"><rect x="906" y="40" width="270" height="230" rx="16" fill="#0C1F18" fill-opacity="0.9" stroke="#1E4A39"/><line x1="930" y1="41" x2="1152" y2="41" stroke="url(#line)"/><text x="928" y="76" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#5FD6A4" letter-spacing="3"  font-style="normal" text-anchor="start" opacity="1">04 DATA &amp; WORKFLOW</text><text x="928" y="126" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#E8F5EE" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">SQLite · PostgreSQL</text><text x="928" y="166" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#E8F5EE" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">Git · GitHub</text><text x="928" y="206" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#8FB3A2" letter-spacing="0"  font-style="normal" text-anchor="start" opacity="1">VS Code</text></g><g class="pop" style="animation-delay:1.20s"><rect x="303" y="148" width="12" height="12" transform="rotate(45 309 154)" fill="#050F0B" stroke="#5FD6A4"><animate attributeName="stroke" values="#5FD6A4;#E6C068;#5FD6A4" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect></g><g class="pop" style="animation-delay:1.45s"><rect x="597" y="148" width="12" height="12" transform="rotate(45 603 154)" fill="#050F0B" stroke="#5FD6A4"><animate attributeName="stroke" values="#5FD6A4;#E6C068;#5FD6A4" dur="4s" begin="0.8s" repeatCount="indefinite"/></rect></g><g class="pop" style="animation-delay:1.70s"><rect x="891" y="148" width="12" height="12" transform="rotate(45 897 154)" fill="#050F0B" stroke="#5FD6A4"><animate attributeName="stroke" values="#5FD6A4;#E6C068;#5FD6A4" dur="4s" begin="1.6s" repeatCount="indefinite"/></rect></g><circle cy="154" r="4" fill="#E8F5EE" opacity="0"><animate attributeName="cx" values="24;1176" dur="9s" begin="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/><animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.1;.9;1" dur="9s" begin="3s" repeatCount="indefinite"/></circle><g class="fade" style="animation-delay:1.2s"><text x="600" y="320" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#8FB3A2" letter-spacing="1"  font-style="normal" text-anchor="middle" opacity="1">End-to-end: problem  →  data  →  model  →  evaluation  →  app  →  deployment</text></g></svg>